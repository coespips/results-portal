<!DOCTYPE html>
<html>
<head>
  <title>College Results</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    input { padding: 10px; width: 250px; }
    button { padding: 10px 20px; }
    #result { margin-top: 20px; }
  </style>
</head>

<body>

<h2>Check Your Result</h2>

<input type="text" id="reg" placeholder="Enter Register Number">
<button onclick="getResult()">Get Result</button>

<div id="result"></div>

<script>
const SHEET_ID = "1yf9T2PfgSp-iE2lTZYBgVr0Acp3rLYxDCeSyv4Uwbno";
const URL = `https://opensheet.elk.sh/${SHEET_ID}/Sheet1`;

async function getResult() {
  const reg = document.getElementById("reg").value;

  const res = await fetch(URL);
  const data = await res.json();

  const student = data.find(row => row.Reg_No == reg);

  if (student) {
    document.getElementById("result").innerHTML =
      `<h3>${student.Name}</h3>
       Sub1: ${student.Sub1}<br>
       Sub2: ${student.Sub2}<br>
       Total: ${student.Total}<br>
       Result: <b>${student.Result}</b>`;
  } else {
    document.getElementById("result").innerHTML = "No result found";
  }
}
</script>

</body>
</html>
