<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St Peter's Institute of Pharmaceutical Sciences - Results</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
      color: #222;
    }

    .header {
      background: #003366;
      color: #fff;
      padding: 20px 12px;
    }

    .header img {
      width: 80px;
      max-width: 25vw;
      display: block;
      margin: 0 auto 10px;
    }

    .header h1 {
      margin: 8px 0 5px;
      font-size: 20px;
    }

    .header h3 {
      margin: 5px 0;
      font-size: 17px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 12px 30px;
    }

    input, select {
      padding: 10px;
      width: 320px;
      max-width: 92%;
      margin: 5px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 15px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      background: #007BFF;
      color: #fff;
      border: 0;
      margin: 5px;
      border-radius: 4px;
      font-size: 15px;
    }

    button:hover {
      background: #0056b3;
    }

    #captchaBox {
      margin-top: 8px;
    }

    #captchaQuestion {
      font-weight: bold;
      display: inline-block;
      margin-bottom: 3px;
    }

    .result-card {
      background: #fff;
      margin: 24px auto 0;
      padding: 18px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,.12);
      overflow-x: auto;
    }

    .result-card h2 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    .result-card h3 {
      margin: 6px 0 14px;
      font-size: 18px;
    }

    .meta {
      margin: 5px 0;
      font-weight: bold;
    }

    table {
      margin: 18px auto;
      border-collapse: collapse;
      width: 100%;
      background: #fff;
      min-width: 520px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 9px 10px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #007BFF;
      color: #fff;
    }

    .final-result {
      font-size: 18px;
      font-weight: bold;
      margin-top: 14px;
    }

    .disclaimer {
      margin-top: 30px;
      color: red;
      font-weight: bold;
    }

    .error {
      color: #b00020;
      font-weight: bold;
      margin-top: 15px;
    }

    .loading {
      color: #444;
      font-weight: bold;
      margin-top: 15px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 18px;
      }

      .header h3 {
        font-size: 15px;
      }

      .container {
        margin-top: 20px;
      }

      .result-card {
        padding: 10px;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 7px 6px;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .header {
        background: #fff;
        color: #000;
        padding: 10px;
      }

      .header img {
        width: 65px;
      }

      .controls, .disclaimer {
        display: none !important;
      }

      .result-card {
        box-shadow: none;
        margin-top: 0;
        padding: 0;
      }

      table {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="logo.png" alt="College Logo">
    <h1>St Peter's Institute of Pharmaceutical Sciences (Autonomous)</h1>
    <h3>Examination Results - July/August 2026</h3>
  </div>

  <div class="container">

    <div class="controls">
      <select id="course">
        <option value="">-- Select Result --</option>
        <option value="BPharm_II_Sem">B.Pharm I Year – II Semester</option>
        <option value="MPharm_Ceutics_II_Sem">M.Pharm Pharmaceutics I Year – II Semester</option>
        <option value="MPharm_Practice_II_Sem">M.Pharm Pharmacy Practice I Year – II Semester</option>
        <option value="PharmD_I_Year">Pharm.D I Year</option>
        <option value="PharmD_PB_I_Year">Pharm.D PB I Year</option>
        <option value="Supp_BPharm_I_Sem">Supplementary B.Pharm I Year – I Semester</option>
        <option value="Supp_MPharm_Ceutics_I_Sem">Supplementary M.Pharm Pharmaceutics I Semester</option>
      </select>

      <br>

      <input
        type="text"
        id="reg"
        placeholder="Enter Register Number"
        autocomplete="off"
      >

      <div id="captchaBox">
        <span id="captchaQuestion"></span><br>
        <input
          type="text"
          id="captchaInput"
          placeholder="Enter answer"
          inputmode="numeric"
          autocomplete="off"
        >
      </div>

      <br>

      <button type="button" onclick="getResult()">Get Result</button>
      <button type="button" onclick="printResult()">Print</button>
    </div>

    <div id="result"></div>

    <div class="disclaimer">
      Revaluation can be applied at Exam Cell on or before 09/10/2026.
    </div>

  </div>

<script>
"use strict";

/*
  Only these 7 sheets are configured below.
  The previous 3 result sheets are intentionally NOT included.
*/
const SHEET_ID = "1vjbp0RXoE4P9uhW1cRmXhkNVKASHkn4itfLwPU64IJM";

const COURSE_CONFIG = {

      ["SMPP205P", "Pharmacy Practice Practical II"],
      ["Seminar", "Seminar/Assignment"]
    ]
  },

  PharmD_I_Year: {
    title: "Pharm.D I Year",
    type: "pharmd",
    metric: "Percentage",
    subjects: [
      {

      {

        name: "Pharmaceutics",
        theory: "SDP1.2T",

        result: "SDP1.2_Result"
      },
      {

        name: "Medicinal Biochemistry",
        theory: "SDP1.3T",

      {

      {

      },
      {

      }
    ]
  },

  PharmD_PB_I_Year: {
    title: "Pharm.D PB I Year",
    type: "pharmd",
    metric: "Percentage",
    subjects: [
      {
        code: "SDP4.1",
        name: "Pharmacotherapeutics-III",
        theory: "SDP4.1T",
        practical: "SDP4.1P",
        result: "SDP4.1_Result"
      },
      {

        name: "Hospital Pharmacy",

      },
      {
        code: "SDP4.3",

        result: "SDP4.3_Result"
      },
      {

        name: "Biostatistics & Research Methodology",

      },
      {
        code: "SDP4.5",

      },
      {

      {

  Supp_BPharm_I_Sem: {

    type: "supplementary",
    metric: null,
    subjects: [
      ["SBP101T", "Human Anatomy and Physiology I – Theory"],
      ["SBP102T", "Pharmaceutical Analysis I – Theory"],
      ["SBP103T", "Pharmaceutics I – Theory"],
      ["SBP104T", "Pharmaceutical Inorganic Chemistry – Theory"]
    ]
  },

  Supp_MPharm_Ceutics_I_Sem: {
    title: "Supplementary M.Pharm Pharmaceutics I Semester",
    type: "supplementary",
    metric: null,
    subjects: [
      ["SMPH101T", "Modern Pharmaceutical Analytical Techniques"],
      ["SMPH102T", "Drug Delivery Systems"],
      ["SMPH103T", "Modern Pharmaceutics"],
      ["SMPH104T", "Regulatory Affair"],
      ["SMPH105P", "Pharmaceutics Practical I"]
    ]
  }
};

let captchaAnswer = null;

function generateCaptcha() {
  const a = Math.floor(Math.random() * 10);
  const b = Math.floor(Math.random() * 10);

  captchaAnswer = a + b;

  document.getElementById("captchaQuestion").textContent =
    "What is " + a + " + " + b + "?";

  document.getElementById("captchaInput").value = "";
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function clean(value) {
  return String(value ?? "").trim();
}

function isBlank(value) {
  return clean(value) === "";
}

function showError(message) {
  document.getElementById("result").innerHTML =
    '<div class="error">' + escapeHTML(message) + "</div>";
}

function renderRegularResult(student, config) {
  let rows = "";

  config.subjects.forEach(([key, label]) => {
    const value = clean(student[key]);

    rows += `
      <tr>
        <td>${escapeHTML(label)}</td>
        <td>${escapeHTML(value || "-")}</td>
      </tr>
    `;
  });

  const metricRow = config.metric ? `
    <tr>
      <td><b>${escapeHTML(config.metric)}</b></td>
      <td><b>${escapeHTML(clean(student[config.metric]) || "-")}</b></td>
    </tr>
  ` : "";

  return `
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Grade / Result</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        ${metricRow}
      </tbody>
    </table>
  `;
}

function renderPharmDResult(student, config) {
  let rows = "";

  config.subjects.forEach(subject => {

    if (subject.single) {
      const value = clean(student[subject.single]);
      const result = clean(student[subject.result]);

      /*
        Show the subject if either the supplied value or the
        subject-level PASS/FAIL value is present.
      */
      if (isBlank(value) && isBlank(result)) {
        return;
      }

      rows += `
        <tr>
          <td>${escapeHTML(subject.name)}</td>
          <td>${escapeHTML(value || "-")}</td>
          <td>-</td>
          <td>${escapeHTML(result || "-")}</td>
        </tr>
      `;
      return;
    }

    const theory = clean(student[subject.theory]);
    const practical = clean(student[subject.practical]);
    const result = clean(student[subject.result]);

    if (isBlank(theory) && isBlank(practical) && isBlank(result)) {
      return;
    }

    rows += `
      <tr>
        <td>${escapeHTML(subject.name)}</td>
        <td>${escapeHTML(theory || "-")}</td>
        <td>${escapeHTML(practical || "-")}</td>
        <td>${escapeHTML(result || "-")}</td>
      </tr>
    `;
  });

  if (!rows) {
    rows = `
      <tr>
        <td colspan="4">No subject details available</td>
      </tr>
    `;
  }

  return `
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Theory</th>
          <th>Practical</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

function renderSupplementaryResult(student, config) {
  let rows = "";

  config.subjects.forEach(([key, label]) => {
    const value = clean(student[key]);

    /*
      Supplementary rule:
      display ONLY a subject where a grade/value is allotted.
    */
    if (isBlank(value)) {
      return;
    }

    rows += `
      <tr>
        <td>${escapeHTML(label)}</td>
        <td>${escapeHTML(value)}</td>
      </tr>
    `;
  });

  if (!rows) {
    rows = `
      <tr>
        <td colspan="2">No subject grades allotted</td>
      </tr>
    `;
  }

  return `
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Grade / Result</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

async function getResult() {
  const course = document.getElementById("course").value;
  const reg = clean(document.getElementById("reg").value);
  const captcha = clean(document.getElementById("captchaInput").value);
  const resultBox = document.getElementById("result");

  resultBox.innerHTML = "";

  if (!course) {
    showError("Please select a result category.");
    return;
  }

  if (!reg) {
    showError("Please enter register number.");
    return;
  }

  if (captcha === "" || Number(captcha) !== captchaAnswer) {
    showError("Numerical verification failed. Please try again.");
    generateCaptcha();
    return;
  }

  const config = COURSE_CONFIG[course];

  if (!config) {
    showError("Invalid result category.");
    return;
  }

  resultBox.innerHTML =
    '<div class="loading">Loading result...</div>';

  try {
    const url =
      "https://opensheet.elk.sh/" +
      SHEET_ID +
      "/" +
      encodeURIComponent(course);

    const response = await fetch(url, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("Data request failed");
    }

    const data = await response.json();

    const student = data.find(row =>
      clean(row.Reg_No) === reg
    );

    if (!student) {
      showError("No result found for this register number.");
      generateCaptcha();
      return;
    }

    let tableHTML = "";

    if (config.type === "pharmd") {
      tableHTML = renderPharmDResult(student, config);
    } else if (config.type === "supplementary") {
      tableHTML = renderSupplementaryResult(student, config);
    } else {
      tableHTML = renderRegularResult(student, config);
    }

    const metricHTML = config.metric ? `
      <div class="meta">
        ${escapeHTML(config.metric)}:
        ${escapeHTML(clean(student[config.metric]) || "-")}
      </div>
    ` : "";

    resultBox.innerHTML = `
      <div class="result-card">

        <h2>${escapeHTML(config.title)}</h2>

        <h3>${escapeHTML(clean(student.Name) || "")}</h3>

        <div class="meta">
          Register Number:
          ${escapeHTML(clean(student.Reg_No) || reg)}
        </div>

        ${tableHTML}

        ${metricHTML}

        <div class="final-result">
          Result:
          ${escapeHTML(clean(student.Result) || "-")}
        </div>

      </div>
    `;

    generateCaptcha();

  } catch (error) {
    console.error(error);
    showError("Unable to load result. Please try again.");
    generateCaptcha();
  }
}

function printResult() {
  const resultBox = document.getElementById("result");

  if (!resultBox.innerHTML.trim()) {
    showError("Please get a result before printing.");
    return;
  }

  window.print();
}

window.addEventListener("load", generateCaptcha);
</script>

</body>
</html>
