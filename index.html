<!DOCTYPE html>
<html>
<head>
  <title>St Peter's Institute Results</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background-color: #f5f5f5;
      text-align: center;
    }

    /* HEADER */
    .header {
      background-color: #003366;
      color: white;
      padding: 20px;
    }

    .header img {
      width: 80px;
      display: block;
      margin: auto;
    }

    .header h1 {
      margin: 10px 0 5px;
      font-size: 20px;
    }

    .header h3 {
      margin: 0;
      font-weight: normal;
    }

    /* CONTENT */
    .container {
      margin-top: 30px;
    }

    input {
      padding: 10px;
      width: 250px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    td, th {
      border: 1px solid #ccc;
      padding: 8px 12px;
    }

    th {
      background-color: #007BFF;
      color: white;
    }

    #result {
      margin-top: 20px;
    }

    /* DISCLAIMER */
    .disclaimer {
      margin-top: 30px;
      font-size: 14px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="logo.png" alt="College Logo">
  <h1>St Peter's Institute of Pharmaceutical Sciences (Autonomous)</h1>
  <h3>Examination Results</h3>
</div>

<!-- CONTENT -->
<div class="container">
  <h2>Check Your Result</h2>

  <input type="text" id="reg" placeholder="Enter Register Number">
  <button onclick="getResult()">Get Result</button>

  <div id="result"></div>

  <!-- DISCLAIMER -->
  <div class="disclaimer">
    Revaluation can be applied at Exam Cell on or before 18/04/2026.
  </div>
</div>

<script>
const SHEET_ID = "1vjbp0RXoE4P9uhW1cRmXhkNVKASHkn4itfLwPU64IJM";
const URL = `https://opensheet.elk.sh/${SHEET_ID}/Sheet1`;

async function getResult() {
  const reg = document.getElementById("reg").value.trim();

  if (!reg) {
    document.getElementById("result").innerHTML = "Please enter register number";
    return;
  }

  const res = await fetch(URL);
  const data = await res.json();

  const student = data.find(row => row.Reg_No == reg);

  if (!student) {
    document.getElementById("result").innerHTML = "No result found";
    return;
  }

  document.getElementById("result").innerHTML = `
    <h3>${student.Name}</h3>

    <table>
      <tr><th>Subject</th><th>Marks</th></tr>

      <tr><td>SBP101T</td><td>${student.SBP101T}</td></tr>
      <tr><td>SBP102T</td><td>${student.SBP102T}</td></tr>
      <tr><td>SBP103T</td><td>${student.SBP103T}</td></tr>
      <tr><td>SBP104T</td><td>${student.SBP104T}</td></tr>
      <tr><td>SBP105T</td><td>${student.SBP105T}</td></tr>
      <tr><td>SBP106</td><td>${student.SBP106}</td></tr>

      <tr><td>SBP107P</td><td>${student.SBP107P}</td></tr>
      <tr><td>SBP108P</td><td>${student.SBP108P}</td></tr>
      <tr><td>SBP109P</td><td>${student.SBP109P}</td></tr>
      <tr><td>SBP110P</td><td>${student.SBP110P}</td></tr>
      <tr><td>SBP111P</td><td>${student.SBP111P}</td></tr>
      <tr><td>SBP112</td><td>${student.SBP112}</td></tr>

      <tr><td><b>SGPA</b></td><td><b>${student.SGPA}</b></td></tr>
      <tr><td><b>Result</b></td><td><b>${student.Result}</b></td></tr>
    </table>
  `;
}
</script>

</body>
</html>
