<!DOCTYPE html>
<html>
<head>
  <title>College Results</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 40px;
      background-color: #f5f5f5;
    }

    h2 {
      color: #333;
    }

    input {
      padding: 10px;
      width: 250px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    td, th {
      border: 1px solid #ccc;
      padding: 8px 12px;
    }

    th {
      background-color: #007BFF;
      color: white;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h2>Check Your Result</h2>

<input type="text" id="reg" placeholder="Enter Register Number">
<button onclick="getResult()">Get Result</button>

<div id="result"></div>

<script>
const SHEET_ID = "1vjbp0RXoE4P9uhW1cRmXhkNVKASHkn4itfLwPU64IJM";
const URL = `https://opensheet.elk.sh/${SHEET_ID}/Sheet1`;

async function getResult() {
  const reg = document.getElementById("reg").value.trim();

  if (!reg) {
    document.getElementById("result").innerHTML = "Please enter register number";
    return;
  }

  try {
    const res = await fetch(URL);
    const data = await res.json();

    const student = data.find(row => row["Reg_No"] == reg);

    if (!student) {
      document.getElementById("result").innerHTML = "No result found";
      return;
    }

    let tableRows = "";

    for (let key in student) {
      if (key !== "Reg_No" && key !== "Name") {
        tableRows += `<tr><td>${key}</td><td>${student[key]}</td></tr>`;
      }
    }

    document.getElementById("result").innerHTML = `
      <h3>${student["Name"]}</h3>

      <table>
        <tr><th>Subject</th><th>Marks</th></tr>
        ${tableRows}
      </table>
    `;

  } catch (error) {
    document.getElementById("result").innerHTML = "Error loading data";
    console.error(error);
  }
}
</script>

</body>
</html>
