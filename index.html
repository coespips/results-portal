<!DOCTYPE html>
<html>
<head>
  <title>St Peter's Institute Results</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background-color: #f5f5f5;
      text-align: center;
    }

    /* HEADER */
    .header {
      background-color: #003366;
      color: white;
      padding: 20px;
    }

    .header img {
      width: 80px;
      display: block;
      margin: auto;
    }

    .header h1 {
      margin: 10px 0 5px;
      font-size: 20px;
    }

    .header h3 {
      margin: 0;
      font-weight: normal;
    }

    .container {
      margin-top: 30px;
    }

    input {
      padding: 10px;
      width: 250px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      margin: 5px;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    td, th {
      border: 1px solid #ccc;
      padding: 8px 12px;
    }

    th {
      background-color: #007BFF;
      color: white;
    }

    #result {
      margin-top: 20px;
    }

    .disclaimer {
      margin-top: 30px;
      font-size: 14px;
      color: red;
      font-weight: bold;
    }

    @media print {
      button, input {
        display: none;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="logo.png" alt="College Logo">
  <h1>St Peter's Institute of Pharmaceutical Sciences (Autonomous)</h1>
  <h3>Examination Results - March 2026</h3>
</div>

<!-- CONTENT -->
<div class="container">
  <h2>Check Your Result</h2>

  <input type="text" id="reg" placeholder="Enter Register Number">
  <button onclick="getResult()">Get Result</button>
  <button onclick="printResult()">Print</button>

  <div id="result"></div>

  <div class="disclaimer">
    Revaluation can be applied at Exam Cell on or before 18/04/2026.
  </div>
</div>

<script>
const SHEET_ID = "1vjbp0RXoE4P9uhW1cRmXhkNVKASHkn4itfLwPU64IJM";
const URL = `https://opensheet.elk.sh/${SHEET_ID}/Sheet1`;

/* SUBJECT NAMES */
const SUBJECTS = {
  SBP101T: "Human Anatomy & Physiology I",
  SBP102T: "Pharmaceutical Analysis I",
  SBP103T: "Pharmaceutics I",
  SBP104T: "Pharmaceutical Inorganic Chemistry I",
  SBP105T: "Communication Skills",
  SBP106: "Remedial Maths / Biology",

  SBP107P: "HAP Practical",
  SBP108P: "Analysis Practical",
  SBP109P: "Pharmaceutics Practical",
  SBP110P: "Inorganic Practical",
  SBP111P: "Communication Practical",
  SBP112: "Remedial Practical"
};

async function getResult() {
  const reg = document.getElementById("reg").value.trim();

  if (!reg) {
    document.getElementById("result").innerHTML = "Please enter register number";
    return;
  }

  const res = await fetch(URL);
  const data = await res.json();

  const student = data.find(row => row.Reg_No == reg);

  if (!student) {
    document.getElementById("result").innerHTML = "No result found";
    return;
  }

  let rows = "";

  for (let key in SUBJECTS) {
    rows += `
      <tr>
        <td>${SUBJECTS[key]} (${key})</td>
        <td>${student[key] || "-"}</td>
      </tr>
    `;
  }

  document.getElementById("result").innerHTML = `
    <h3>${student.Name}</h3>

    <table>
      <tr><th>Subject</th><th>Marks</th></tr>
      ${rows}
      <tr><td><b>SGPA</b></td><td><b>${student.SGPA}</b></td></tr>
      <tr><td><b>Result</b></td><td><b>${student.Result}</b></td></tr>
    </table>
  `;
}

/* PRINT FUNCTION */
function printResult() {
  window.print();
}
</script>

</body>
</html>
